[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pseudochat"
version = "0.1.0"
description = "An AI chat based on PseudoAgent!"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [
  { name = "Fereydoun Farrahi Moghaddam" }
]

dependencies = ["pseudoagent", "frdfm-llm-tools", "frdfm-python-tools"]

[project.urls]
Homepage = "https://github.com/pseudoconscious/pseudochat"

[tool.setuptools.packages.find]
where = ["."]
include = ["pseudochat*"]
